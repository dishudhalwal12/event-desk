name: External Opportunities Sync

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-opportunities-sync
  cancel-in-progress: false

jobs:
  sync-unstop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/external-import/package-lock.json

      - name: Install importer dependencies
        working-directory: scripts/external-import
        run: npm ci

      - name: Resolve Firebase service account
        id: firebase_creds
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_KRISHNA_E9C59: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KRISHNA_E9C59 }}
        run: |
          SERVICE_ACCOUNT_JSON="${FIREBASE_SERVICE_ACCOUNT_JSON:-$FIREBASE_SERVICE_ACCOUNT}"
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_KRISHNA_E9C59"
          fi

          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing Firebase service account secret. Add FIREBASE_SERVICE_ACCOUNT_JSON, FIREBASE_SERVICE_ACCOUNT, or FIREBASE_SERVICE_ACCOUNT_KRISHNA_E9C59 in GitHub Actions secrets."
            exit 1
          fi

          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
          echo "credentials_path=$CREDENTIALS_FILE" >> "$GITHUB_OUTPUT"

      - name: Sync Unstop opportunities into Firestore
        working-directory: scripts/external-import
        env:
          FIREBASE_PROJECT_ID: krishna-e9c59
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase_creds.outputs.credentials_path }}
        run: node src/index.js --source=unstop --max-urls=50 --verbose
